services:
  # ─── Traeod) ───
  traefik:
    image: traefik:v3.7.8
    container_name: traefik-dev
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      - "--providers.file.filename=/certs/tls.yml"
      - "--providers.file.watch=true"
    networks:
      - proxy

  # ─── Base de datos ───
  db:
    image: postgres:17-alpine
    container_name: tms-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tms_user}
      POSTGRES_PASSWORD: ${DB_PASS:-tms_pass}
      POSTGRES_DB: ${DB_NAME:-tms_db}
      TZ: America/Havana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tms_user} -d ${DB_NAME:-tms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tms-dev
    security_opt:
      - no-new-privileges:true

  # ─── Adminer ───
  adminer:
    image: adminer:5.4.2
    container_name: tms-adminer-dev
    restart: always
    environment:
      - TZ=America/Havana
    depends_on:
      - db
    networks:
      - tms-dev
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tmsdb.rule=Host(`tmsdb.syscargo.cu`)"
      - "traefik.http.routers.tmsdb.entrypoints=websecure"
      - "traefik.http.routers.tmsdb.tls=true"
      - "traefik.http.services.tmsdb.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    security_opt:
      - no-new-privileges:true

  # ─── Backend   ───
  backend:
    build:
      context: ./tms-backend
      dockerfile: Dockerfile
      target: development
    container_name: tms-backend-dev
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-tms_user}
      DB_PASS: ${DB_PASS:-tms_pass}
      DB_NAME: ${DB_NAME:-tms_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-prod}
      NODE_ENV: development
      NODE_OPTIONS: "--no-experimental-require-module"
      TZ: America/Havana
    # No expone puerto directo — va por Traefik
    # Pero sí el debugger de Node para attach desde VS Code
    ports:
      - "9229:9229"
    volumes:
      - ./tms-backend:/app
      - /app/node_modules
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
      - backend-node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tms-dev
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-syscargo.rule=Host(`api.syscargo.cu`)"
      - "traefik.http.routers.api-syscargo.entrypoints=websecure"
      - "traefik.http.routers.api-syscargo.tls=true"
      - "traefik.http.services.api-syscargo.loadbalancer.server.port=5000"
      - "traefik.docker.network=proxy"
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "api.syscargo.cu:host-gateway"
      - "tms.syscargo.cu:host-gateway"
      - "admin.syscargo.cu:host-gateway"

  # ─── Frontend Clieik) ───
  front-cliente:
    build:
      context: ./tms-front-cliente
      dockerfile: Dockerfile
      target: development
    container_name: tms-front-cliente-dev
    restart: always
    environment:
      - TZ=America/Havana
      # En dev Vite lee esto, pero como usamos Traefik con HTTPS,
      # la app sigue apuntando a https://api.syscargo.cu (igual que prod)
      - VITE_API_BASE_URL=https://api.syscargo.cu
    volumes:
      - ./tms-front-cliente:/app
      - cliente-node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - tms-dev
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.syscargo.rule=Host(`tms.syscargo.cu`)"
      - "traefik.http.routers.syscargo.entrypoints=websecure"
      - "traefik.http.routers.syscargo.tls=true"
      - "traefik.http.services.syscargo.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "api.syscargo.cu:host-gateway"
      - "tms.syscargo.cu:host-gateway"
      - "admin.syscargo.cu:host-gateway"

  # ─── Frontend Adimin) ───
  front-admin:
    build:
      context: ./tms-front-admin
      dockerfile: Dockerfile
      target: development
    container_name: tms-front-admin-dev
    restart: always
    environment:
      - TZ=America/Havana
      - VITE_API_BASE_URL=https://api.syscargo.cu
    volumes:
      - ./tms-front-admin:/app
      - admin-node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - tms-dev
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admintms.rule=Host(`admin.syscargo.cu`)"
      - "traefik.http.routers.admintms.entrypoints=websecure"
      - "traefik.http.routers.admintms.tls=true"
      - "traefik.http.services.admintms.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "api.syscargo.cu:host-gateway"
      - "tms.syscargo.cu:host-gateway"
      - "admin.syscargo.cu:host-gateway"

networks:
  tms-dev:
    driver: bridge
  proxy:
    external: true

volumes:
  backend-node_modules:
  cliente-node_modules:
  admin-node_modules:
  backend-uploads:
  backend-logs:
